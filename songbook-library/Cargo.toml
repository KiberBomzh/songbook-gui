[package]
name = "songbook"
version = "0.1.3"
edition = "2024"
description = "Songbook with TUI and CLI"
license = "GPL-3.0"
repository = "https://github.com/KiberBomzh/songbook-tui"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["song", "chord", "songbook", "tui"]

[lib]
name = "songbook"
path = "src/core/lib.rs"

[[bin]]
name = "songbook"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5.56", features = ["derive"], optional = true }
ratatui = { version = "0.30.0", optional = true }
dirs = { version = "6.0.0", optional = true }
edit = { version = "0.1.5", optional = true }
rfd = { version = "0.17.2", features = ["gtk3"], default-features = false, optional = true }
toml = { version = "1.0.3", optional = true }
include_dir = { version = "0.7.4", optional = true }
serde_yaml = { version = "0.9.34", optional = true }
scraper = { version = "0.27.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
anyhow = "1.0.100"
serde_json = "1.0.149"
zip = "8.2.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.11.0", features = ["blocking"], optional = true }

[features]
default = []
colored = ["dep:crossterm"]
from_url = ["dep:scraper"]
reqwest = ["from_url", "dep:reqwest"]
song_library = ["dep:dirs", "dep:edit", "dep:include_dir", "dep:serde_yaml"]
cli = ["dep:clap", "song_library"]
tui = ["dep:ratatui", "dep:rfd", "dep:toml", "cli", "colored"]

[lints.clippy]
needless_return = "allow"
manual_strip = "allow"
