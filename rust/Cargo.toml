[package]
name = "rust_lib_songbook"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
songbook = { path = "../songbook-library", features = ["song_library", "from_url"] }
anyhow = "1.0.102"
zip = "8.6.0"
dirs = "6.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
